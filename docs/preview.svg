<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="A skill board above the composer: one skill switched on with a level chosen, one left request-only, and the trigger chip highlighted in the composer tool row">
  <!-- Skill board -->
  <rect x="72" y="34" width="496" height="162" rx="16" fill="none" stroke="#8b949e" stroke-width="2"/>
  <rect x="88" y="50" width="54" height="8" rx="4" fill="#9aa4ad"/>

  <!-- Row 1: standing, level chosen -->
  <rect x="88" y="72" width="100" height="11" rx="5.5" fill="#9aa4ad"/>
  <rect x="200" y="66" width="56" height="22" rx="11" fill="#d3e7e1"/>
  <circle cx="216" cy="77" r="4" fill="#2f8a78"/>
  <rect x="226" y="73" width="22" height="8" rx="4" fill="#2f8a78"/>
  <rect x="496" y="70" width="48" height="26" rx="13" fill="#2f8a78"/>
  <circle cx="531" cy="83" r="9" fill="#ffffff"/>

  <rect x="88" y="94" width="42" height="16" rx="8" fill="#2f8a78"/>
  <rect x="136" y="94" width="42" height="16" rx="8" fill="none" stroke="#8b949e" stroke-width="1.5"/>
  <rect x="184" y="94" width="42" height="16" rx="8" fill="none" stroke="#8b949e" stroke-width="1.5"/>
  <rect x="232" y="94" width="42" height="16" rx="8" fill="none" stroke="#8b949e" stroke-width="1.5"/>

  <line x1="88" y1="124" x2="552" y2="124" stroke="#8b949e" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Row 2: request-only -->
  <rect x="88" y="142" width="76" height="11" rx="5.5" fill="#9aa4ad"/>
  <rect x="176" y="136" width="44" height="22" rx="11" fill="none" stroke="#8b949e" stroke-width="1.5"/>
  <rect x="184" y="143" width="22" height="8" rx="4" fill="#8b949e"/>
  <rect x="496" y="140" width="48" height="26" rx="13" fill="none" stroke="#8b949e" stroke-width="2"/>
  <circle cx="509" cy="153" r="9" fill="#8b949e"/>

  <rect x="88" y="170" width="60" height="8" rx="4" fill="#9aa4ad" fill-opacity="0.55"/>

  <!-- Composer card directly below the board -->
  <rect x="72" y="210" width="496" height="56" rx="16" fill="none" stroke="#8b949e" stroke-width="2"/>
  <rect x="88" y="221" width="196" height="9" rx="4.5" fill="#9aa4ad"/>
  <rect x="88" y="238" width="52" height="18" rx="9" fill="none" stroke="#8b949e" stroke-width="1.5"/>
  <rect x="148" y="238" width="64" height="18" rx="9" fill="#2f8a78"/>
  <rect x="156" y="245" width="20" height="4" rx="2" fill="#ffffff"/>
  <circle cx="186" cy="247" r="3" fill="#ffffff"/>
  <rect x="220" y="238" width="44" height="18" rx="9" fill="none" stroke="#8b949e" stroke-width="1.5"/>
</svg>
